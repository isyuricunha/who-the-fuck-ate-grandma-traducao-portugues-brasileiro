name: Permissão de contribuição
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  consent:
    runs-on: ubuntu-24.04
    steps:
      # Only trusted base-branch code runs. Never checkout or execute PR code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Conferir aceite afirmativo e autoria
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python translation-work/consent.py
